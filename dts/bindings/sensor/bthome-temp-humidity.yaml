description: Temperature & Humidity sensor for BTHome

compatible: "bthome-temp-humidity"

include: base.yaml

properties:
  sensor:
    type: phandle
    required: true
    description: |
      The temperature and humidity sensor device

  include-temperature:
    type: boolean
    description: include the temperature as a BTHome output

  include-humidity:
    type: boolean
    description: include the humidity as a BTHome output
