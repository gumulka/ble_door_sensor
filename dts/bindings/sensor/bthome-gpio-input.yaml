description: GPIO Input for binary sensor in BTHome

compatible: "bthome-binary-gpio"

include: base.yaml

properties:
  input-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO to use for interrupt detection

  bthome-sensor-type:
    type: int
    default: 0x2D
    description: |
      The sensor type acording to the bthome specification
      Must be a binary sensor
